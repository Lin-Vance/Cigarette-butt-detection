<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>烟踪智治管理员登录</title>

<link rel="stylesheet" href="./styles.css"></head>
<body>
  <main class="fit-shell">
    <div class="fit-box">
      <section class="screen" aria-label="烟踪智治管理员登录页面">
        <img class="page-artwork original" src="./assets/blue_city_skyline_login_background_ai_original.png" alt="blue_city_skyline_login_background_ai_original">
        <img class="page-artwork composite" src="./assets/blue_city_skyline_login_background_local_composite.png" alt="blue_city_skyline_login_background_local_composite">

        <section class="brand-area" aria-label="品牌标识">
          <img class="brand-logo" src="./assets/super_admin_brand_logo.png" alt="super_admin_brand_logo">
        </section>

        <section class="feature-grid" aria-label="平台功能">
          <article class="feature-card ai">
            <img class="feature-art ai-art" src="./assets/ai_recognition_icon.png" alt="ai_recognition_icon">
            <h2 class="feature-title">AI智能识别</h2>
          </article>

          <article class="feature-card evidence">
            <img class="feature-art evidence-art" src="./assets/evidence_chain_icon.png" alt="evidence_chain_icon">
            <h2 class="feature-title">行为证据链</h2>
          </article>

          <article class="feature-card sanitation">
            <img class="feature-art sanitation-art" src="./assets/sanitation_dispatch_icon.png" alt="sanitation_dispatch_icon">
            <h2 class="feature-title">环卫协同调度</h2>
          </article>
        </section>

        <section class="login-panel" aria-label="管理员登录">
          <header class="login-heading">
            <h1 class="login-title">管理员登录</h1>
            <p class="login-subtitle">欢迎登录烟踪智治超级管理员端</p>
          </header>

          <form class="login-form" novalidate>
            <div class="field-group account">
              <label class="field-label" for="account">管理员账号</label>
              <div class="input-shell">
                <span class="field-icon" aria-hidden="true">
                  <svg viewBox="0 0 32 32" fill="none">
                    <circle cx="16" cy="10" r="6.2" stroke="currentColor" stroke-width="2.2"></circle>
                    <path d="M5.8 27.2c.8-5.1 4.3-7.4 10.2-7.4s9.4 2.3 10.2 7.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
                    <path d="M5.8 27.2h20.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
                  </svg>
                </span>
                <input class="field-input" type="text" id="account" name="account" placeholder="请输入管理员账号" autocomplete="username">
              </div>
            </div>

            <div class="field-group password">
              <label class="field-label" for="password">登录密码</label>
              <div class="input-shell">
                <span class="field-icon" aria-hidden="true">
                  <svg viewBox="0 0 32 32" fill="none">
                    <rect x="5.3" y="13.1" width="21.4" height="15.1" rx="1.8" stroke="currentColor" stroke-width="2.2"></rect>
                    <path d="M9.8 13.1V9.7a6.2 6.2 0 0 1 12.4 0v3.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
                    <circle cx="16" cy="20" r="1.5" fill="currentColor"></circle>
                    <path d="M16 21.5v3.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
                  </svg>
                </span>
                <input class="field-input" type="password" id="password" name="password" placeholder="请输入登录密码" autocomplete="current-password">
                <span class="password-eye" aria-hidden="true" title="显示/隐藏密码">
                  <svg viewBox="0 0 34 30" fill="none">
                    <path d="M2.4 15s5.1-8.2 14.6-8.2S31.6 15 31.6 15 26.5 23.2 17 23.2 2.4 15 2.4 15Z" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"></path>
                    <circle cx="17" cy="15" r="4" stroke="currentColor" stroke-width="2.3"></circle>
                  </svg>
                </span>
              </div>
            </div>

            <div class="field-group captcha">
              <label class="field-label" for="captcha">验证码</label>
              <div class="input-shell captcha-input">
                <span class="field-icon" aria-hidden="true">
                  <svg viewBox="0 0 32 32" fill="none">
                    <path d="M16 3.8 26.7 8v7.8c0 6.1-4 10.6-10.7 13.2C11.3 26.4 5.3 21.9 5.3 15.8V8L16 3.8Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path>
                    <path d="m11.3 15.8 3.1 3.2 6.5-6.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </span>
                <input class="field-input" type="text" id="captcha" name="captcha" placeholder="请输入验证码" autocomplete="off">
              </div>

              <img class="captcha-image" src="./assets/captcha_verification_image.png" alt="captcha_verification_image">
            </div>

            <div class="login-options">
              <label class="remember">
                <input type="checkbox" class="remember-check" name="remember" checked>
                <span>记住账号</span>
              </label>
              <button type="button" class="forgot-password">忘记密码</button>
            </div>

            <button class="secure-login" type="submit">安全登录</button>
          </form>
        </section>

        <footer class="copyright">烟踪智治公共场所无烟治理平台 · © 2026</footer>
      </section>
    </div>
  </main>

<script src="./script.js"></script><script src="../shared/product-nav.js?v=4.1"></script></body></html>

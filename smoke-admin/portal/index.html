<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烟踪智治 · 页面聚合门户</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
  body { display: flex; flex-direction: column; background: #0d1b3e; }

  .portal-header {
    height: 52px; flex: 0 0 52px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px;
    background: linear-gradient(90deg, #12275c 0%, #1b3a86 100%);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    z-index: 10;
  }
  .portal-logo { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
  .portal-title { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  .portal-sub { font-size: 12px; opacity: .65; }
  .portal-header .spacer { flex: 1; }
  .page-count { font-size: 12px; opacity: .7; }

  .portal-body { flex: 1; display: flex; min-height: 0; }

  .sidebar {
    width: 248px; flex: 0 0 248px;
    overflow-y: auto;
    background: #0d1b3e;
    border-right: 1px solid rgba(255,255,255,.08);
    padding: 10px 0 30px;
    scrollbar-width: thin;
    scrollbar-color: #2c4a8f transparent;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: #2c4a8f; border-radius: 3px; }

  .nav-group { margin-top: 14px; }
  .nav-group-label {
    padding: 4px 18px 6px;
    font-size: 11px; letter-spacing: 2px;
    color: #6f8ac0; text-transform: uppercase;
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    margin: 2px 10px;
    padding: 8px 12px;
    border-radius: 8px;
    color: #c6d4f2;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, color .15s;
    user-select: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav-item.active { background: #2b57c9; color: #fff; font-weight: 600; }
  .nav-item .idx {
    flex: 0 0 20px; height: 20px; line-height: 20px; text-align: center;
    border-radius: 5px; font-size: 11px;
    background: rgba(255,255,255,.12); color: #9db4e2;
  }
  .nav-item.active .idx { background: rgba(255,255,255,.25); color: #fff; }

  .frame-wrap { flex: 1; position: relative; min-width: 0; background: #dfe9ef; }
  .frame-wrap iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: none;
    background: #dfe9ef;
  }
  .frame-wrap iframe.active { display: block; }

  .frame-loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #dfe9ef; z-index: 5;
    color: #3a5aa0; font-size: 14px; letter-spacing: 2px;
    transition: opacity .25s; pointer-events: none;
  }
  .frame-loading.hidden { opacity: 0; }

  .prev-btn, .next-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 34px; height: 56px; border: 0; border-radius: 8px;
    background: rgba(13,27,62,.55); color: #fff;
    font-size: 18px; cursor: pointer; z-index: 6;
    opacity: 0; transition: opacity .2s;
  }
  .frame-wrap:hover .prev-btn, .frame-wrap:hover .next-btn { opacity: 1; }
  .prev-btn { left: 8px; }
  .next-btn { right: 8px; }
  .prev-btn:hover, .next-btn:hover { background: rgba(13,27,62,.8); }

  .page-badge {
    position: absolute; right: 14px; bottom: 12px;
    padding: 4px 12px; border-radius: 20px;
    background: rgba(13,27,62,.7); color: #fff;
    font-size: 12px; z-index: 6; pointer-events: none;
  }
</style>
</head>
<body>

<header class="portal-header">
  <img class="portal-logo" src="../2.png-html/assets/smoke_control_brand_logo.png" alt="logo"
       onerror="this.style.display='none'">
  <div>
    <div class="portal-title">烟踪智治 · 页面聚合门户</div>
  </div>
  <div class="portal-sub">AI 烟头乱扔智能识别与环卫调度系统</div>
  <div class="spacer"></div>
  <div class="page-count">共 18 个页面</div>
</header>

<div class="portal-body">
  <nav class="sidebar" id="sidebar"></nav>

  <div class="frame-wrap">
    <div class="frame-loading" id="loading">页面加载中…</div>
    <button class="prev-btn" id="prevBtn" title="上一页">‹</button>
    <button class="next-btn" id="nextBtn" title="下一页">›</button>
    <div class="page-badge" id="pageBadge"></div>
    <div id="frames"></div>
  </div>
</div>

<script>
(() => {
  const BASE = "../";
  const PAGES = [
    { n: "1",  title: "管理员登录",       group: "账号入口" },
    { n: "2",  title: "项目总览首页",     group: "态势总览" },
    { n: "3",  title: "治理态势 · 未闭环预警", group: "态势总览" },
    { n: "4",  title: "设备运行地图",     group: "态势总览" },
    { n: "10", title: "全域治理 GIS 地图", group: "态势总览" },
    { n: "6",  title: "告警数据列表",     group: "事件中心" },
    { n: "7",  title: "事件报表",         group: "事件中心" },
    { n: "15", title: "数据分析",         group: "事件中心" },
    { n: "5",  title: "状态总览 · 任务分布", group: "调度中心" },
    { n: "8",  title: "调度中心任务池",   group: "调度中心" },
    { n: "9",  title: "调度记录管理",     group: "调度中心" },
    { n: "11", title: "设备档案管理",     group: "资源管理" },
    { n: "12", title: "环卫资源管理",     group: "资源管理" },
    { n: "13", title: "模型与数据集管理", group: "AI 治理" },
    { n: "14", title: "AI 阈值配置",      group: "AI 治理" },
    { n: "16", title: "用户账号管理",     group: "系统管理" },
    { n: "17", title: "全平台基础配置",   group: "系统管理" },
    { n: "18", title: "审计日志",         group: "系统管理" }
  ];

  const sidebar = document.getElementById("sidebar");
  const frames = document.getElementById("frames");
  const loading = document.getElementById("loading");
  const badge = document.getElementById("pageBadge");
  let current = 0;
  const iframes = [];

  const groups = [];
  PAGES.forEach((p, i) => {
    if (!groups.includes(p.group)) groups.push(p.group);
  });

  groups.forEach(g => {
    const gEl = document.createElement("div");
    gEl.className = "nav-group";
    gEl.innerHTML = '<div class="nav-group-label">' + g + "</div>";
    PAGES.forEach((p, i) => {
      if (p.group !== g) return;
      const item = document.createElement("div");
      item.className = "nav-item";
      item.dataset.index = i;
      item.innerHTML = '<span class="idx">' + p.n + "</span>" + p.title;
      item.addEventListener("click", () => show(i));
      gEl.appendChild(item);
    });
    sidebar.appendChild(gEl);
  });

  PAGES.forEach((p, i) => {
    const f = document.createElement("iframe");
    f.src = BASE + p.n + ".png-html/index.html";
    f.title = p.title;
    f.addEventListener("load", () => { if (i === current) loading.classList.add("hidden"); });
    frames.appendChild(f);
    iframes.push(f);
  });

  function show(i) {
    if (i < 0 || i >= PAGES.length) return;
    current = i;
    iframes.forEach((f, k) => f.classList.toggle("active", k === i));
    document.querySelectorAll(".nav-item").forEach(el => {
      el.classList.toggle("active", +el.dataset.index === i);
    });
    loading.classList.remove("hidden");
    if (iframes[i].dataset.loaded) loading.classList.add("hidden");
    iframes[i].dataset.loaded = "1";
    badge.textContent = (i + 1) + " / " + PAGES.length + " · " + PAGES[i].title;
    const act = document.querySelector(".nav-item.active");
    if (act) act.scrollIntoView({ block: "nearest" });
    try { history.replaceState(null, "", "#" + PAGES[i].n); } catch (e) {}
  }

  document.getElementById("prevBtn").addEventListener("click", () => show(current - 1));
  document.getElementById("nextBtn").addEventListener("click", () => show(current + 1));

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") show(current - 1);
    if (e.key === "ArrowRight") show(current + 1);
  });

  const hash = location.hash.replace("#", "");
  const idx = PAGES.findIndex(p => p.n === hash);
  show(idx >= 0 ? idx : 0);
})();
</script>
</body>
</html>
